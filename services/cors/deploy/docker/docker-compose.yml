# CrossFerry CORS proxy alone: docker compose -f services/cors/deploy/docker/docker-compose.yml up -d --build
services:
  cors:
    build:
      context: ../../../..
      dockerfile: services/cors/deploy/docker/Dockerfile
    # prebuilt: CROSSFERRY_CORS_IMAGE=ghcr.io/<owner>/crossferry-cors:latest ... up -d --no-build
    image: ${CROSSFERRY_CORS_IMAGE:-crossferry-cors}
    env_file:
      - path: ../../.env
        required: false
    environment:
      # must listen on all interfaces inside the container; restrict exposure with the port mapping
      CROSSFERRY_HOST: "0.0.0.0"
      CROSSFERRY_CORS_PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
    init: true
